services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hold
      POSTGRES_PASSWORD: hold
      POSTGRES_DB: hold
    ports:
      - "5432:5432"
    volumes:
      - hold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hold -d hold"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  hold_pgdata:
